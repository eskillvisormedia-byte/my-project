<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:#F5F8FC; --grid:rgba(0,83,160,.07); --navy:#041E42; --blue:#0071CE;
    --blue2:#2B8FE8; --sky:#E3EEFA; --yellow:#FFC220; --muted:#8A9BB4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
  body{font-family:'Inter','Inter Display',sans-serif;color:var(--navy)}
  #stage{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
  .grid{position:absolute;inset:-60px;
    background-image:linear-gradient(var(--grid) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px);
    background-size:72px 72px}
  .scene{position:absolute;inset:0;display:none;transform-origin:50% 50%}
  .abs{position:absolute}
  .w{display:inline-block;will-change:transform,opacity,filter}
  .obj{position:absolute;filter:drop-shadow(0 40px 40px rgba(4,30,66,.18)) drop-shadow(0 8px 12px rgba(4,30,66,.12))}
  .lines{position:absolute;inset:0}
  .lines path{fill:none;stroke:var(--navy);stroke-width:2;opacity:.55}
  .arc{fill:none;stroke:var(--blue);stroke-linecap:round;opacity:.16}
  .sm{font-size:64px;font-weight:500;letter-spacing:-1px;line-height:1.15}
  .big{font-weight:800;letter-spacing:-4px;line-height:.95;color:var(--blue)}
  .chip{position:absolute;width:150px;height:150px;border-radius:40px;background:linear-gradient(145deg,#1A86E0,#0062B8);
    box-shadow:0 22px 40px rgba(0,98,184,.28), inset 0 2px 0 rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center}
  .chip svg{width:92px;height:92px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .cat{position:absolute;font-size:96px;font-weight:800;letter-spacing:-3px;color:var(--navy)}
  .pill{position:absolute;left:90px;width:900px;height:150px;border-radius:75px;background:var(--blue);color:#fff;
    font-size:60px;font-weight:700;letter-spacing:-1px;display:flex;align-items:center;justify-content:center;gap:24px;
    box-shadow:0 28px 50px rgba(0,113,206,.32)}
  .kicker{font-size:34px;font-weight:600;letter-spacing:6px;color:var(--blue);text-transform:uppercase}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="spark">
      <rect x="-3.4" y="-15" width="6.8" height="10.5" rx="3.4"/>
      <rect x="-3.4" y="-15" width="6.8" height="10.5" rx="3.4" transform="rotate(60)"/>
      <rect x="-3.4" y="-15" width="6.8" height="10.5" rx="3.4" transform="rotate(120)"/>
      <rect x="-3.4" y="-15" width="6.8" height="10.5" rx="3.4" transform="rotate(180)"/>
      <rect x="-3.4" y="-15" width="6.8" height="10.5" rx="3.4" transform="rotate(240)"/>
      <rect x="-3.4" y="-15" width="6.8" height="10.5" rx="3.4" transform="rotate(300)"/>
    </g>
  </defs>
</svg>
<div id="stage">
  <div class="grid" id="grid"></div>

  <!-- ============ SCENE 1 : Walmart isn't just about groceries ============ -->
  <div class="scene" id="s1">
    <svg class="lines" viewBox="0 0 1080 1920">
      <path id="l1a" d="M-40 1500 C 300 1100, 700 700, 1120 120"/>
      <path id="l1b" d="M-40 760 C 300 640, 700 560, 1120 520"/>
      <path id="l1c" d="M760 -40 C 700 600, 560 1300, 300 1980"/>
    </svg>

    <!-- shopping cart top-right -->
    <svg class="obj" id="cart" style="left:600px;top:120px;width:460px;height:400px" viewBox="0 0 230 200">
      <defs>
        <linearGradient id="cb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B8FE8"/><stop offset="1" stop-color="#0062B8"/></linearGradient>
        <linearGradient id="bx" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
      </defs>
      <rect x="78" y="32" width="56" height="56" rx="6" fill="url(#bx)" stroke="#BFD3EA" stroke-width="2"/>
      <rect x="78" y="52" width="56" height="10" fill="#FFC220" opacity=".9"/>
      <rect x="120" y="18" width="48" height="70" rx="6" fill="#fff" stroke="#BFD3EA" stroke-width="2"/>
      <circle cx="144" cy="46" r="11" fill="#E3EEFA"/><path d="M138 46 h12" stroke="#0071CE" stroke-width="3"/>
      <path d="M8 22 H38 L60 138 H186" fill="none" stroke="#041E42" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M44 56 H210 L194 120 H56 Z" fill="url(#cb)"/>
      <path d="M44 56 H210 L194 120 H56 Z" fill="none" stroke="#041E42" stroke-width="5" stroke-linejoin="round"/>
      <path d="M90 60 V116 M128 60 V116 M166 60 V116 M50 88 H202" stroke="#fff" stroke-width="3" opacity=".55"/>
      <rect x="70" y="70" width="114" height="36" rx="8" fill="#fff"/>
      <text x="77" y="95" font-family="Inter" font-weight="800" font-size="19" letter-spacing="-.7" fill="#0071CE">Walmart</text>
      <use href="#spark" fill="#FFC220" transform="translate(170 88) scale(.6)"/>
      <circle cx="78" cy="166" r="16" fill="#041E42"/><circle cx="78" cy="166" r="6" fill="#fff"/>
      <circle cx="172" cy="166" r="16" fill="#041E42"/><circle cx="172" cy="166" r="6" fill="#fff"/>
    </svg>

    <!-- grocery bag bottom-left -->
    <svg class="obj" id="bag" style="left:-30px;top:1250px;width:600px;height:640px" viewBox="0 0 300 320">
      <defs>
        <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DDE8F4"/></linearGradient>
        <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C9DAEE"/><stop offset="1" stop-color="#E9F0F8"/></linearGradient>
        <linearGradient id="bread" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2C47E"/><stop offset="1" stop-color="#C98A3E"/></linearGradient>
      </defs>
      <!-- produce -->
      <g transform="rotate(-18 120 80)"><rect x="104" y="0" width="34" height="150" rx="17" fill="url(#bread)"/>
        <path d="M110 30 l22 -8 M110 60 l22 -8 M110 90 l22 -8" stroke="#FBE2B4" stroke-width="4" stroke-linecap="round"/></g>
      <path d="M170 110 C 150 60, 180 30, 210 20 C 214 60, 200 95, 170 110Z" fill="#3DAA5C"/>
      <path d="M180 112 C 200 70, 240 60, 262 64 C 250 100, 220 116, 180 112Z" fill="#2E8F4A"/>
      <path d="M172 108 L 205 32" stroke="#1F6E36" stroke-width="3"/>
      <circle cx="78" cy="104" r="30" fill="#E8483B"/><circle cx="68" cy="94" r="8" fill="#fff" opacity=".35"/>
      <path d="M78 74 q4 -12 14 -14" stroke="#3B2A1A" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- bag -->
      <path d="M40 110 H230 L246 316 H24 Z" fill="url(#bg1)"/>
      <path d="M230 110 L262 126 L276 300 L246 316 Z" fill="url(#bg2)"/>
      <rect x="31" y="170" width="208" height="54" fill="#0071CE"/>
      <path d="M239 170 L266 182 L270 232 L242 224 Z" fill="#0058A3"/>
      <path d="M40 110 H230" stroke="#C9DAEE" stroke-width="3"/>
      <path d="M90 130 C 90 96, 180 96, 180 130" fill="none" stroke="#9FB7D3" stroke-width="7" stroke-linecap="round"/>
      <text x="45" y="209" font-family="Inter" font-weight="800" font-size="35" letter-spacing="-1.2" fill="#fff">Walmart</text>
      <use href="#spark" fill="#FFC220" transform="translate(205 197) scale(1.05)"/>
    </svg>

    <div class="abs" style="left:110px;top:760px">
      <div class="sm"><span class="w" data-in="0.55">Walmart</span> <span class="w" data-in="0.85">Isn't</span></div>
      <div class="sm"><span class="w" data-in="1.15">Just</span> <span class="w" data-in="1.4">About</span></div>
      <div class="big" style="font-size:156px;margin-top:6px"><span class="w" data-in="1.8" data-pop="1">Groceries</span></div>
      <svg width="760" height="40" style="display:block;margin-top:10px"><path id="ul1" d="M6 24 C 200 6, 500 6, 750 20" fill="none" stroke="#FFC220" stroke-width="10" stroke-linecap="round"/></svg>
    </div>
  </div>

  <!-- ============ SCENE 2 : Categories ============ -->
  <div class="scene" id="s2">
    <svg class="lines" viewBox="0 0 1080 1920">
      <path id="l2a" d="M-40 260 C 400 360, 760 200, 1120 300"/>
      <path id="l2b" d="M185 380 V 1560"/>
      <path id="l2c" d="M-40 1720 C 360 1620, 760 1820, 1120 1640"/>
    </svg>
    <div class="abs kicker" style="left:110px;top:300px"><span class="w" data-in="0.1">Shop every category</span></div>
    <div id="cats"></div>
  </div>

  <!-- ============ SCENE 3 : Thousands of businesses ============ -->
  <div class="scene" id="s3">
    <svg class="lines" viewBox="0 0 1080 1920">
      <path id="l3a" d="M-40 980 C 300 900, 800 1060, 1120 940"/>
      <path id="l3b" d="M900 -40 C 860 500, 1000 900, 940 1980"/>
    </svg>
    <div id="stores"></div>
    <div class="abs" style="left:110px;top:1080px">
      <div class="sm" style="font-size:60px"><span class="w" data-in="0.9">Thousands</span> <span class="w" data-in="1.1">of</span> <span class="w" data-in="1.25">businesses</span></div>
      <div class="sm" style="font-size:60px"><span class="w" data-in="1.5">sell</span> <span class="w" data-in="1.65">across</span> <span class="w" data-in="1.85">categories</span></div>
      <div class="sm" style="font-size:60px;color:var(--muted)"><span class="w" data-in="2.1">through</span></div>
      <div class="big" style="font-size:150px;margin-top:18px"><span class="w" data-in="2.4" data-pop="1">Walmart</span></div>
      <div class="big" style="font-size:112px;color:var(--navy);letter-spacing:-3px"><span class="w" data-in="2.7" data-pop="1">Marketplace</span></div>
    </div>
  </div>

  <!-- ============ SCENE 4 : CTA ============ -->
  <div class="scene" id="s4">
    <svg class="lines" viewBox="0 0 1080 1920">
      <path id="arc4" class="arc" d="M1180 260 C 700 520, 420 1100, 560 2000" stroke-width="70"/>
      <path id="l4a" d="M-40 640 C 300 560, 700 760, 1120 600"/>
    </svg>
    <!-- laptop with store dashboard -->
    <svg class="obj" id="laptop" style="left:330px;top:150px;width:820px;height:600px" viewBox="0 0 410 300">
      <defs><linearGradient id="lb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B3A66"/><stop offset="1" stop-color="#041E42"/></linearGradient>
      <linearGradient id="kb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6EDF6"/><stop offset="1" stop-color="#B9C8DB"/></linearGradient></defs>
      <rect x="40" y="10" width="330" height="214" rx="14" fill="url(#lb)"/>
      <rect x="52" y="22" width="306" height="190" rx="6" fill="#fff"/>
      <rect x="52" y="22" width="306" height="30" rx="6" fill="#0071CE"/><rect x="52" y="40" width="306" height="12" fill="#0071CE"/>
      <circle cx="70" cy="37" r="6" fill="#FFC220"/><rect x="84" y="32" width="80" height="10" rx="5" fill="#fff" opacity=".85"/>
      <rect x="64" y="64" width="130" height="66" rx="8" fill="#E3EEFA"/>
      <path id="chart" d="M74 120 L96 108 L116 112 L138 92 L160 96 L184 72" fill="none" stroke="#0071CE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="206" y="64" width="140" height="30" rx="8" fill="#F1F5FA"/><rect x="216" y="74" width="70" height="10" rx="5" fill="#041E42" opacity=".7"/>
      <rect x="206" y="100" width="140" height="30" rx="8" fill="#F1F5FA"/><rect x="216" y="110" width="96" height="10" rx="5" fill="#0071CE" opacity=".8"/>
      <rect x="64" y="142" width="88" height="58" rx="8" fill="#F1F5FA"/><rect x="88" y="152" width="40" height="28" rx="4" fill="#BFD3EA"/>
      <rect x="160" y="142" width="88" height="58" rx="8" fill="#F1F5FA"/><rect x="184" y="152" width="40" height="28" rx="4" fill="#FFC220" opacity=".8"/>
      <rect x="256" y="142" width="88" height="58" rx="8" fill="#F1F5FA"/><rect x="280" y="152" width="40" height="28" rx="4" fill="#0071CE" opacity=".7"/>
      <path d="M0 232 H410 L392 256 H18 Z" fill="url(#kb)"/><rect x="170" y="232" width="70" height="8" rx="4" fill="#9FB2CA"/>
    </svg>
    <div class="abs" style="left:110px;top:880px">
      <div class="sm"><span class="w" data-in="0.6">Learn</span> <span class="w" data-in="0.8">How</span> <span class="w" data-in="0.95">to</span></div>
      <div class="big" style="font-size:150px;margin-top:6px"><span class="w" data-in="1.25" data-pop="1">Sell</span> <span class="w" data-in="1.45" data-pop="1">on</span></div>
      <div class="big" style="font-size:150px"><span class="w" data-in="1.7" data-pop="1">Walmart</span></div>
    </div>
    <div class="pill" id="pill" style="top:1430px">
      <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2c3 3 3 17 0 20M12 2c-3 3-3 17 0 20"/></svg>
      <span>www.eskillvisor.com</span>
    </div>
    <div id="ripple" class="abs" style="width:40px;height:40px;border-radius:50%;border:6px solid #fff;left:0;top:0;opacity:0"></div>
    <svg id="cursor" class="abs" width="90" height="110" viewBox="0 0 18 22" style="filter:drop-shadow(0 8px 10px rgba(4,30,66,.3))">
      <path d="M1 1 L1 17 L5 13.5 L8 20.5 L11 19.2 L8 12.4 L13.5 12.4 Z" fill="#fff" stroke="#041E42" stroke-width="1.4" stroke-linejoin="round"/>
    </svg>
  </div>

  <div id="flash" class="abs" style="inset:0;background:#fff;opacity:0"></div>
</div>

<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=t=>1-Math.pow(1-t,3);
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const back=t=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
const $=id=>document.getElementById(id);

// scene timing [start,end]
const S=[['s1',0,4.4],['s2',4.4,8.6],['s3',8.6,12.8],['s4',12.8,18.0]];
const DURATION=18.0;

// ----- build category rows -----
const CATS=[
  ['Electronics','<rect x="9" y="12" width="30" height="19" rx="2"/><path d="M5 36h38l-2 3H7z"/>'],
  ['Beauty','<rect x="17" y="27" width="14" height="13" rx="2"/><rect x="19.5" y="20" width="9" height="7"/><path d="M19.5 20v-7l9-4v11"/>'],
  ['Home','<path d="M7 23L24 9l17 14"/><path d="M12 19.5V39h24V19.5"/><rect x="20" y="28" width="8" height="11"/>'],
  ['Fashion','<path d="M17 9l-7 4-4 7 6 3 2-2v18h20V21l2 2 6-3-4-7-7-4c-1 3-4 5-7 5s-6-2-7-5z"/>'],
  ['Health &amp; Wellness','<path d="M24 39C10 30 6 22 8 16c2-6 10-8 16-1 6-7 14-5 16 1 2 6-2 14-16 23z"/><path d="M12 24h7l3-5 4 10 3-5h7"/>'],
];
let html='';
CATS.forEach((c,i)=>{
  const y=420+i*230;
  html+=`<div class="chip" id="chip${i}" style="left:110px;top:${y}px"><svg viewBox="0 0 48 48">${c[1]}</svg></div>`;
  html+=`<div class="cat" style="left:300px;top:${y+22}px;${i==4?'font-size:80px;top:'+(y+32)+'px':''}"><span class="w" data-in="${0.5+i*0.55}">${c[0]}</span></div>`;
});
$('cats').innerHTML=html;

// ----- build store grid -----
const STORE=(hl)=>`<svg viewBox="0 0 60 60" width="150" height="150">
  <rect x="8" y="22" width="44" height="32" rx="3" fill="#fff" stroke="#C9DAEE" stroke-width="1.5"/>
  <path d="M6 12h48l3 12H3z" fill="${hl?'#FFC220':'#0071CE'}"/>
  <path d="M15 12l-3 12M24 12l-1.5 12M36 12l1.5 12M45 12l3 12" stroke="#fff" stroke-width="3"/>
  <path d="M3 24q4.5 5 9 0q4.5 5 9 0q4.5 5 9 0q4.5 5 9 0q4.5 5 9 0q4.5 5 9 0" fill="${hl?'#FFC220':'#0071CE'}"/>
  <rect x="24" y="36" width="12" height="18" rx="1.5" fill="#0071CE"/>
  <rect x="12" y="34" width="8" height="8" rx="1" fill="#E3EEFA"/><rect x="40" y="34" width="8" height="8" rx="1" fill="#E3EEFA"/></svg>`;
let sh='';const order=[];
for(let r=0;r<4;r++)for(let c=0;c<5;c++){
  const i=r*5+c; const x=95+c*185, y=170+r*190;
  const d=Math.hypot(c-2,r-1.5);
  order.push(d);
  sh+=`<div class="obj" id="st${i}" style="left:${x}px;top:${y}px;width:150px;height:150px;filter:drop-shadow(0 14px 16px rgba(4,30,66,.14))">${STORE(i==7||i==16)}</div>`;
}
$('stores').innerHTML=sh;

// prepare line lengths
document.querySelectorAll('.lines path, #ul1, #chart').forEach(p=>{
  const L=p.getTotalLength(); p.dataset.len=L; p.style.strokeDasharray=L; p.style.strokeDashoffset=L;
});

function draw(id,t0,dur,lt){const p=$(id);const L=+p.dataset.len;p.style.strokeDashoffset=L*(1-eio(clamp((lt-t0)/dur)));}

function words(scene,lt){
  scene.querySelectorAll('.w').forEach(w=>{
    const tin=+w.dataset.in; const pop=w.dataset.pop;
    const p=clamp((lt-tin)/(pop?0.55:0.45));
    const e=eo(p);
    w.style.opacity=clamp(p*1.6);
    const s=pop?lerp(0.8,1,back(p)):lerp(0.94,1,e);
    w.style.transform=`translateY(${(1-e)*(pop?40:24)}px) scale(${s})`;
    w.style.filter=`blur(${(1-e)*10}px)`;
  });
}

function enter(el,lt,t0,dur,dx,dy,rot,floatAmp=8,floatSeed=0){
  const p=eo(clamp((lt-t0)/dur));
  const fy=Math.sin((lt+floatSeed)*1.6)*floatAmp*p, fr=Math.sin((lt+floatSeed)*1.1)*1.2*p;
  el.style.transform=`translate(${(1-p)*dx}px,${(1-p)*dy+fy}px) rotate(${(1-p)*rot+fr}deg)`;
  el.style.opacity=clamp(p*2.5);
}

function render(t){
  // background grid drift
  $('grid').style.transform=`translate(${(t*6)%72}px,${(t*-4)%72}px)`;
  let flash=0;
  S.forEach(([id,a,b],k)=>{
    const sc=$(id); const on=t>=a&&(t<b||k==S.length-1);
    sc.style.display=on?'block':'none';
    if(!on) return;
    const lt=t-a;
    // slow push-in like the reference
    sc.style.transform=`scale(${1+0.035*clamp(lt/(b-a))})`;
    if(k>0) flash=Math.max(flash,1-clamp(lt/0.25));
    words(sc,lt);
    if(id=='s1'){
      draw('l1a',0,1.3,lt);draw('l1b',0.2,1.3,lt);draw('l1c',0.35,1.4,lt);
      enter($('cart'),lt,0.0,1.1,420,-260,18,10,1);
      enter($('bag'),lt,0.15,1.2,-420,420,-16,8,0);
      draw('ul1',2.35,0.7,lt);
    }
    if(id=='s2'){
      draw('l2a',0,1.2,lt);draw('l2b',0.3,2.8,lt);draw('l2c',0.2,1.3,lt);
      CATS.forEach((c,i)=>{
        const p=clamp((lt-(0.4+i*0.55))/0.55);
        const ch=$('chip'+i);
        ch.style.opacity=clamp(p*3);
        ch.style.transform=`scale(${p<=0?0:back(p)}) rotate(${(1-eo(p))*-25}deg) translateY(${Math.sin(lt*2+i)*4*p}px)`;
      });
    }
    if(id=='s3'){
      draw('l3a',0,1.2,lt);draw('l3b',0.15,1.4,lt);
      order.forEach((d,i)=>{
        const p=clamp((lt-(0.05+d*0.17))/0.5);
        const el=$('st'+i);
        el.style.opacity=clamp(p*3);
        el.style.transform=`translateY(${(1-eo(p))*60+Math.sin(lt*1.8+i)*4*p}px) scale(${p<=0?0.4:lerp(0.4,1,back(p))})`;
      });
    }
    if(id=='s4'){
      draw('arc4',1.9,1.1,lt);draw('l4a',0,1.2,lt);draw('chart',0.9,1.0,lt);
      enter($('laptop'),lt,0.0,1.1,520,-200,10,7,2);
      const pp=clamp((lt-2.2)/0.6);
      const pill=$('pill');
      // click press
      const press=lt>3.55&&lt<3.85?Math.sin((lt-3.55)/0.3*Math.PI)*0.05:0;
      pill.style.opacity=clamp(pp*2.5);
      pill.style.transform=`translateY(${(1-eo(pp))*80}px) scale(${(pp<=0?0.7:lerp(0.7,1,back(pp)))-press})`;
      // cursor
      const cp=eio(clamp((lt-2.8)/0.75));
      const cx=lerp(1120,700,cp), cy=lerp(1900,1505,cp);
      const cur=$('cursor');
      cur.style.left=cx+'px';cur.style.top=cy+'px';
      cur.style.opacity=clamp((lt-2.8)*4);
      cur.style.transform=`scale(${1-press*2})`;
      const rp=clamp((lt-3.6)/0.6);
      const rip=$('ripple');
      rip.style.left=(700-20)+'px';rip.style.top=(1505-20)+'px';
      rip.style.opacity=rp>0&&rp<1?(1-rp):0;
      rip.style.transform=`scale(${1+rp*6})`;
    }
  });
  $('flash').style.opacity=flash*0.85;
}
window.render=render; window.DURATION=DURATION;
render(0);
</script>
</body>
</html>
